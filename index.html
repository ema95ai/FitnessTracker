<html lang="it">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker Fitness">
<title>Tracker Fitness</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0f14;--surf:#151820;--card:#1c2030;--brd:#252a3a;--acc:#e8ff47;--a2:#47c8ff;--a3:#ff6b47;--legs:#a8ff47;--rest:#9b47ff;--txt:#e8ecf4;--mut:#6b7594}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,sans-serif;height:100%;overscroll-behavior:none}
input,textarea,select,button{font-family:-apple-system,sans-serif;font-size:16px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:700px;margin:0 auto}
#header{background:var(--surf);border-bottom:1px solid var(--brd);padding:env(safe-area-inset-top,16px) 16px 0;flex-shrink:0;z-index:10}
#header-inner{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.app-title{font-weight:900;font-size:20px;letter-spacing:-.5px}
.app-title span{color:var(--acc)}
.app-badge{background:var(--acc);color:#000;font-weight:800;font-size:10px;padding:4px 10px;border-radius:4px}
.app-date{font-size:10px;color:var(--mut)}
#tabbar{display:flex;background:var(--surf);border-top:1px solid var(--brd);padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0;z-index:10}
.tab-btn{flex:1;padding:10px 4px 12px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:10px;font-weight:600;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tab-btn.active{color:var(--acc)}
.tab-btn .ico{font-size:20px;line-height:1}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card-header{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.inp{background:var(--surf);border:1px solid var(--brd);color:var(--txt);border-radius:8px;padding:10px 12px;width:100%;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:60px}
.btn{background:var(--card);border:1px solid var(--brd);color:var(--txt);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:inline-block;text-align:center;user-select:none;-webkit-user-select:none;position:relative;z-index:2}
.btn:active{opacity:.7}
.btn-acc{background:var(--acc);color:#000;border-color:var(--acc)}
.btn-danger{border-color:var(--a3);color:var(--a3)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:20px}
.macro-row{margin-bottom:10px}
.macro-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.macro-label span:first-child{color:var(--mut)}
.prog-bar{height:6px;background:var(--brd);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.macro-cell{background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:8px;text-align:center}
.macro-val{font-weight:800;font-size:15px}
.macro-lbl{font-size:9px;color:var(--mut);margin-top:2px}
.day-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.day-pills::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:center;min-width:50px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.plan-ex-row{padding:10px 14px;border-bottom:1px solid #ffffff08;display:flex;align-items:flex-start;gap:10px}
.plan-ex-num{font-weight:800;font-size:13px;color:var(--mut);min-width:22px;padding-top:2px}
.plan-ex-name{font-weight:700;font-size:14px;color:var(--txt);margin-bottom:2px}
.plan-ex-target{font-size:11px;color:var(--mut)}
.plan-ex-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;margin-top:4px}
.set-grid{display:grid;grid-template-columns:68px 60px 1fr 32px;gap:4px;align-items:center;margin-bottom:4px}
.set-head{font-size:9px;color:var(--mut);letter-spacing:1px;padding-bottom:4px;border-bottom:1px solid var(--brd);margin-bottom:6px}
.preview-box{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-top:8px;text-align:center}
.prev-val{font-weight:800;font-size:15px}
.prev-lbl{font-size:9px;color:var(--mut);margin-top:1px}
.hist-row{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;touch-action:manipulation}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px;text-align:center}
.kpi-val{font-weight:800;font-size:18px}
.kpi-lbl{font-size:9px;color:var(--mut);margin-top:2px}
.sess-row{padding:10px 14px;border-bottom:1px solid #ffffff0a;display:grid;grid-template-columns:80px 1fr 60px 20px;gap:6px;align-items:center;cursor:pointer;font-size:12px;touch-action:manipulation}
.detail-row{padding:4px 0;display:flex;gap:14px;font-size:12px;color:var(--mut)}
#flash{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;font-weight:800;font-size:13px;padding:8px 20px;border-radius:20px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#flash.show{opacity:1}
#modal-overlay{display:none;position:fixed;inset:0;background:#000000bb;z-index:500;align-items:center;justify-content:center;padding:20px}
#modal-overlay.open{display:flex}
#modal-box{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto}
#modal-box h3{font-size:16px;font-weight:800;margin-bottom:14px}
</style>
</head>

        <div class="app-title">TRACKER <span>FITNESS</span></div>
        <div class="app-date" id="today-label"></div>
      </div>
      <div class="app-badge">4 GIORNI · 2026</div>
    </div>

    <button class="tab-btn" onclick="switchTab('progress')"><span class="ico">📈</span>Progressi</button>
  </div>
</div>
<div id="modal-overlay" onclick="closeModal()">

</div>

function flash(msg,color){
  const f=$("flash");f.textContent=msg;
  f.style.background=color||"#e8ff47";f.style.color=(color&&color!=="#e8ff47")?"#fff":"#000";
  f.classList.add("show");setTimeout(()=>f.classList.remove("show"),2000);
}
function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class")e.className=v;
    else if(k==="style")e.style.cssText=v;
    else if(k.startsWith("on"))e[k]=v;
    else e.setAttribute(k,v);
  });
  if(children)children.forEach(c=>{if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}

function initLogDay(){
  const wIdx=getWorkoutIdx(logDayIdx);
  const e=DB.entries[todayStr()];
  if(e&&e.dayIdx===wIdx){logSets=[...e.sets];logNote=e.notes||"";}
  else{logSets=[];logNote="";}
}

// ── Recupera le serie dell'ultima sessione per un esercizio ──────────────
function getLastSessionSets(wIdx,ei){
  // Cerca tutte le sessioni con lo stesso dayIdx, ordinate per data desc
  const prev=Object.entries(DB.entries)
    .filter(([d,e])=>e.dayIdx===wIdx&&!e.skipped&&d!==todayStr())
    .sort((a,b)=>b[0].localeCompare(a[0]));
  for(const [date,entry] of prev){
    const sets=(entry.sets||[]).filter(s=>s.ei===ei);
    if(sets.length)return{date,sets};
  }
  return null;
}

      const kgs=lastSess.sets.map(s=>s.kg||"—");
      const rps=lastSess.sets.map(s=>s.reps||"—");
      const maxKg=Math.max(...lastSess.sets.map(s=>parseFloat(s.kg)||0));
      const prevRow=el("div",{style:"margin-top:5px;background:#e8ff4709;border:1px solid #e8ff4722;border-radius:6px;padding:5px 8px"});
      const prevTop=el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"});
      prevTop.appendChild(el("span",{style:"font-size:9px;color:var(--acc);font-weight:700;letter-spacing:.3px"},["📊 ULTIMA VOLTA · "+lastSess.date.slice(5)]));
      prevTop.appendChild(el("span",{style:"font-size:9px;color:var(--mut)"},[lastSess.sets.length+" serie · max "+maxKg+" kg"]));
      prevRow.appendChild(prevTop);
      const setsStr=lastSess.sets.map((s,i)=>"S"+(i+1)+": "+(s.kg||"—")+"kg×"+(s.reps||"—")).join("  ");
      prevRow.appendChild(el("div",{style:"font-size:10px;color:var(--mut);line-height:1.6"},[setsStr]));
      ch.appendChild(prevRow);
    }
    card.appendChild(ch);
    const body=el("div",{style:"padding:10px 14px 14px"});
    if(ex.note)body.appendChild(el("div",{style:"font-size:10px;color:var(--a2);margin-bottom:8px"},["💡 "+ex.note]));
    if(mySets.length){
      const headRow=el("div",{class:"set-grid set-head"});
      ["KG","RIP","NOTA",""].forEach(h=>headRow.appendChild(el("div",{},[h])));
      body.appendChild(headRow);
    }
    logSets.forEach((s,gi)=>{
      if(s.ei!==ei)return;
      const row=el("div",{class:"set-grid",style:"margin-bottom:4px"});
      const kgI=el("input",{class:"inp",type:"number",placeholder:"0 kg",style:"padding:7px 8px;font-size:15px"});
      kgI.value=s.kg;kgI.addEventListener("input",()=>{logSets[gi].kg=kgI.value;});
      const rpI=el("input",{class:"inp",type:"number",placeholder:ex.reps,style:"padding:7px 8px;font-size:15px"});
      rpI.value=s.reps;rpI.addEventListener("input",()=>{logSets[gi].reps=rpI.value;});
      const ntI=el("input",{class:"inp",type:"text",placeholder:"RPE…",style:"padding:7px 8px;font-size:13px"});
      ntI.value=s.note||"";ntI.addEventListener("input",()=>{logSets[gi].note=ntI.value;});
      const delS=el("button",{style:"background:var(--surf);border:1px solid var(--brd);border-radius:6px;color:var(--a3);font-size:18px;cursor:pointer;padding:0;line-height:1;width:32px;height:40px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;flex-shrink:0",
        onclick:()=>{logSets.splice(gi,1);render();}},["×"]);
      [kgI,rpI,ntI,delS].forEach(x=>row.appendChild(x));
      body.appendChild(row);
    });
    const remaining=ex.sets-mySets.length;
    body.appendChild(el("button",{class:"btn",style:"margin-top:8px;font-size:12px;padding:7px 14px;width:100%;background:var(--surf)",
      onclick:()=>{logSets.push({ei,kg:"",reps:"",note:""});render();}},
      [remaining>0?"+ Serie ("+mySets.length+"/"+ex.sets+" · mancano "+remaining+")":"+ Serie extra"]));
    card.appendChild(body);
    c.appendChild(card);
  });

  const ta=el("textarea",{class:"inp",placeholder:"Note sessione (energia, dolori, mood…)",style:"margin-bottom:10px"});
  ta.value=logNote;ta.addEventListener("input",()=>{logNote=ta.value;});
  c.appendChild(ta);

  const br=el("div",{class:"btn-row"});
  br.appendChild(el("button",{class:"btn btn-acc",style:"flex:2",onclick:()=>{
    DB.entries[dk]={dayIdx:wIdx,sets:[...logSets],notes:logNote,ts:new Date().toISOString()};
    saveDB("entries");flash("✓ Sessione salvata!");
  }},["💾 Salva sessione"]));
  br.appendChild(el("button",{class:"btn",style:"flex:1",onclick:()=>{logSets=[];logNote="";render();flash("Reset fatto","#9b47ff");}},["🔄 Reset"]));
  if(DB.entries[dk]&&DB.entries[dk].dayIdx===wIdx&&!DB.entries[dk].skipped){
    br.appendChild(el("button",{class:"btn btn-danger",style:"flex:1",onclick:()=>{
      if(!confirm("Eliminare?"))return;
      delete DB.entries[dk];saveDB("entries");logSets=[];logNote="";render();
    }},["🗑️"]));
  }
  c.appendChild(br);
  renderSkipSection(c,dk,wIdx);
}

// ── Sezione SALTA ALLENAMENTO (estratta per riuso) ────────────────────
function renderSkipSection(c,dk,wIdx){
  const skipWrap=el("div",{style:"margin-top:8px"});
  if(DB.entries[dk]&&DB.entries[dk].skipped){
    const skipBox=el("div",{style:"background:#ff6b4722;border:1px solid #ff6b4766;border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center"});
    skipBox.appendChild(el("div",{},[
      el("div",{style:"font-weight:800;font-size:12px;color:var(--a3);letter-spacing:.3px"},["🚫 ALLENAMENTO SALTATO"]),
      el("div",{style:"font-size:11px;color:var(--mut);margin-top:3px"},[DB.entries[dk].skipReason||"Motivo non specificato"])
    ]));
    skipBox.appendChild(el("button",{class:"btn btn-sm",style:"flex-shrink:0",onclick:()=>{delete DB.entries[dk];saveDB("entries");render();flash("Annullato","#9b47ff");}},["Annulla"]));
    skipWrap.appendChild(skipBox);
  } else if(!DB.entries[dk]){
    skipWrap.appendChild(el("button",{class:"btn",style:"width:100%;border-color:var(--a3);color:var(--a3);padding:11px;font-size:13px",onclick:()=>openSkipModal(dk,wIdx)},["🚫 Salta allenamento — segna il motivo"]));
  }
  c.appendChild(skipWrap);
}

        const btn=el("button",{class:"btn",style:"text-align:left;padding:9px 12px;font-size:12px;touch-action:manipulation",onclick:()=>{
          $("modal-ex-name").value=alt.n;
          $("modal-ex-note").value=alt.note||"";

          altWrap.querySelectorAll("button").forEach(b=>{b.style.borderColor="var(--brd)";b.style.background="var(--card)";b.style.color="var(--txt)";});

// ── SKIP MODAL — con opzione scala scheda ─────────────────────────────
function openSkipModal(dk,wIdx){
  openModal("Perché salti l'allenamento?",body=>{
    const reasons=["🏥 Infortunio / Dolore","💼 Lavoro / Turno di servizio","😴 Stanchezza eccessiva","🏠 Impegni personali","✈️ Fuori sede / Trasferta","🤒 Malattia","📝 Altro motivo"];
    let selBtn=null;
    const grp=el("div",{style:"display:flex;flex-direction:column;gap:6px;margin-bottom:12px"});
    reasons.forEach(r=>{
      const b=el("button",{class:"btn",style:"text-align:left;padding:10px 12px;font-size:13px;font-weight:500;touch-action:manipulation",onclick:()=>{
        if(selBtn){selBtn.style.borderColor="var(--brd)";selBtn.style.background="var(--card)";selBtn.style.color="var(--txt)";}
        b.style.borderColor="var(--a3)";b.style.background="#ff6b4722";b.style.color="var(--a3)";
        selBtn=b;ci.value="";
      }},[r]);
      grp.appendChild(b);
    });
    body.appendChild(grp);
    body.appendChild(el("div",{style:"font-size:11px;color:var(--mut);margin-bottom:5px"},["Oppure scrivi il motivo:"]));
    const ci=el("input",{class:"inp",type:"text",placeholder:"Es. mal di schiena, imprevisto…",style:"margin-bottom:16px"});
    body.appendChild(ci);

    // Separatore opzioni
    body.appendChild(el("div",{style:"font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.5px;margin-bottom:8px"},["COSA VUOI FARE?"]));

    const doSkip=(shift)=>{
      const reason=ci.value.trim()||(selBtn?selBtn.textContent:"");
      if(!reason){flash("Seleziona o scrivi un motivo","#ff6b47");return;}
      // Salva come saltato con il wIdx corretto
      DB.entries[dk]={dayIdx:wIdx,skipped:true,skipReason:reason,ts:new Date().toISOString()};
      saveDB("entries");
      if(shift){
        // Scala l'intera scheda di 1 giorno
        DB.scheduleOffset=(DB.scheduleOffset+1);
        saveDB("scheduleOffset");
        flash("🔄 Scheda scalata di 1 giorno","#47c8ff");
      } else {
        flash("🚫 Segnato come saltato","#ff6b47");
      }
      closeModal();logSets=[];logNote="";logView="plan";render();$("content").scrollTop=0;
    };

    // Bottone principale — scala scheda
    const shiftBtn=el("button",{class:"btn",style:"width:100%;border-color:var(--a2);color:var(--a2);touch-action:manipulation;margin-bottom:8px;padding:12px;text-align:left",onclick:()=>doSkip(true)});
    shiftBtn.innerHTML='<div style="font-weight:800;font-size:13px;margin-bottom:3px">🔄 Salta e scala la scheda di 1 giorno</div><div style="font-size:11px;color:var(--mut);font-weight:400">Domani vedrai l\'allenamento di oggi. La scheda si aggiorna automaticamente.</div>';
    body.appendChild(shiftBtn);

    // Bottone secondario — salta senza modifiche
    body.appendChild(el("button",{class:"btn btn-danger",style:"width:100%;touch-action:manipulation;margin-bottom:8px;padding:11px",onclick:()=>doSkip(false)},["🚫 Salta senza modificare la scheda"]));
    body.appendChild(el("button",{class:"btn",style:"width:100%;",onclick:closeModal},["Annulla"]));
  });
}

// ── GET EX DEFS ───────────────────────────────────────────────────────
function getExDefs(workoutIdx){
  const raw=DB.exDefs[workoutIdx];
  if(!raw||!raw.length)return DEF_DAYS[workoutIdx].exs.map(e=>({...e}));
  return raw.map(x=>typeof x==="string"?{n:x,sets:3,reps:"10",note:""}:{...x});
}

function exportBackup(){
  const data={
    entries:DB.entries,
    nutrition:DB.nutrition,
    exDefs:DB.exDefs,
    recoveries:DB.recoveries,
    scheduleOffset:DB.scheduleOffset,
    programStart:DB.programStart,
    currentPhase:DB.currentPhase,
    exportedAt:new Date().toISOString(),
    version:"1.0"
  };
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  const date=new Date().toISOString().slice(0,10);
  a.download="tracker-fitness-backup-"+date+".json";
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  flash("💾 Backup esportato!","#47c8ff");
}

function importBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.entries&&!data.nutrition){flash("File non valido","#ff6b47");return;}
      if(!confirm("Importare il backup? I dati attuali verranno sostituiti.")){return;}
      if(data.entries){DB.entries=data.entries;saveDB("entries");}
      if(data.nutrition){DB.nutrition=data.nutrition;saveDB("nutrition");}
      if(data.exDefs){DB.exDefs=data.exDefs;saveDB("exDefs");}
      if(data.recoveries){DB.recoveries=data.recoveries;saveDB("recoveries");}
      if(data.scheduleOffset!==undefined){DB.scheduleOffset=data.scheduleOffset;saveDB("scheduleOffset");}
      if(data.programStart){DB.programStart=data.programStart;saveDB("programStart");}
      if(data.currentPhase){DB.currentPhase=data.currentPhase;saveDB("currentPhase");}
      flash("✓ Backup importato!","#a8ff47");
      render();
    }catch(err){flash("Errore lettura file","#ff6b47");}
  };
  reader.readAsText(file);
}

  c.appendChild(el("div",{style:"font-weight:800;font-size:17px;margin-bottom:12px"},["📈 PROGRESSI"]));
  const dc=el("div",{class:"card",style:"padding:12px"});
  dc.appendChild(el("div",{style:"font-size:10px;color:var(--mut);letter-spacing:1px;margin-bottom:6px"},["GIORNO (workout)"]));
  const dp=el("div",{style:"display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px"});
  DEF_DAYS.forEach((d,i)=>{if(!d.exs.length)return;dp.appendChild(el("button",{class:"btn",style:"font-size:10px;padding:6px 10px;touch-action:manipulation;border-color:"+(i===progDay?d.color:"var(--brd)")+";background:"+(i===progDay?d.color+"22":"var(--surf)")+";color:"+(i===progDay?d.color:"var(--mut)")+";white-space:nowrap",onclick:()=>{progDay=i;progEx=0;progOpenSess=null;render();}},[d.label+" "+d.name]));});
  dc.appendChild(dp);
  dc.appendChild(el("div",{style:"font-size:10px;color:var(--mut);letter-spacing:1px;margin-bottom:6px"},["ESERCIZIO"]));
  const ep=el("div",{style:"display:flex;flex-wrap:wrap;gap:5px"});
  exNames.forEach((n,i)=>{ep.appendChild(el("button",{class:"btn",style:"font-size:10px;padding:6px 10px;touch-action:manipulation;border-color:"+(i===progEx?"var(--acc)":"var(--brd)")+";background:"+(i===progEx?"#e8ff4722":"var(--surf)")+";color:"+(i===progEx?"var(--acc)":"var(--mut)"),onclick:()=>{progEx=i;progOpenSess=null;render();}},[n]));});
  dc.appendChild(ep);c.appendChild(dc);
  const sr=el("div",{class:"btn-row",style:"margin-bottom:12px"});
  [["maxkg","🏆 Peso max"],["volume","⚡ Volume"],["sets","🔢 Serie"]].forEach(([id,lbl])=>{sr.appendChild(el("button",{class:"btn"+(progStatType===id?" btn-acc":""),style:"touch-action:manipulation",onclick:()=>{progStatType=id;render();}},[lbl]));});
  c.appendChild(sr);
  const progressData=[];
  Object.entries(DB.entries).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,e])=>{
    if(e.dayIdx!==progDay||e.skipped)return;
    const ms=(e.sets||[]).filter(s=>s.ei===progEx);if(!ms.length)return;
    const kgs=ms.map(s=>parseFloat(s.kg)||0).filter(x=>x>0);if(!kgs.length)return;
    const maxkg=Math.max(...kgs),vol=ms.reduce((a,s)=>a+(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0),0);
    progressData.push({label:date.slice(5),date,maxkg,vol:Math.round(vol),sets:ms.length,allSets:ms});
  });
  const color=progStatType==="maxkg"?"#ff6b47":progStatType==="volume"?"#47c8ff":"#a8ff47";
  const chartData=progressData.map(p=>({label:p.label,v:progStatType==="maxkg"?p.maxkg:progStatType==="volume"?p.vol:p.sets}));
  const cc=el("div",{class:"card",style:"padding:14px"});
  cc.appendChild(el("div",{style:"font-weight:700;font-size:13px;color:"+color+";margin-bottom:2px"},[exNames[progEx]||""]));
  cc.appendChild(el("div",{style:"font-size:11px;color:var(--mut);margin-bottom:12px"},[progStatType==="maxkg"?"Peso massimo per sessione (kg)":progStatType==="volume"?"Volume per sessione (kg×rep)":"Numero serie per sessione"]));
  if(chartData.length>=2){cc.appendChild(buildSparkline(chartData,color));}
  else{cc.appendChild(el("div",{style:"color:var(--mut);font-size:12px;text-align:center;padding:16px 0"},["Servono ≥2 sessioni per il grafico"]));}
  c.appendChild(cc);
  if(progressData.length){
    const allMax=progressData.map(p=>p.maxkg),pr=Math.max(...allMax),prDate=progressData.find(p=>p.maxkg===pr)?.date||"";
    const latest=progressData[progressData.length-1],first=progressData[0],diff=fmt(latest.maxkg-first.maxkg);
    const tCol=diff>0?"var(--legs)":diff<0?"var(--a3)":"var(--mut)";
    const kg=el("div",{class:"kpi-grid"});
    [{l:"RECORD",v:pr+" kg",sub:prDate.slice(5),c:"var(--acc)"},{l:"ULTIMA",v:latest.maxkg+" kg",sub:"",c:"var(--a2)"},{l:"PROGRESSO",v:(diff>0?"+":"")+diff+" kg",sub:"",c:tCol}].forEach(x=>{
      const kc=el("div",{class:"kpi-card"});kc.appendChild(el("div",{class:"kpi-val",style:"color:"+x.c},[x.v]));kc.appendChild(el("div",{class:"kpi-lbl"},[x.l]));
      if(x.sub)kc.appendChild(el("div",{style:"font-size:9px;color:var(--mut)"},[x.sub]));kg.appendChild(kc);
    });
    c.appendChild(kg);
  }
  const sc=el("div",{class:"card",style:"overflow:hidden"});
  sc.appendChild(el("div",{style:"padding:10px 13px;border-bottom:1px solid var(--brd);font-weight:700;font-size:11px;color:var(--mut);letter-spacing:.5px"},["CRONOLOGIA ("+progressData.length+" sessioni)"]));
  if(!progressData.length){sc.appendChild(el("div",{style:"padding:20px;text-align:center;color:var(--mut);font-size:12px"},["Nessun dato ancora per questo esercizio."]));}
  else{[...progressData].reverse().forEach((p,i)=>{
    const isOpen=progOpenSess===i;
    const row=el("div",{class:"sess-row",onclick:()=>{progOpenSess=isOpen?null:i;render();}});
    row.appendChild(el("div",{style:"color:var(--mut);font-size:11px"},[p.date]));
    row.appendChild(el("div",{style:"font-weight:700;color:var(--acc)"},[p.maxkg+" kg max"]));
    row.appendChild(el("div",{style:"color:var(--a2);font-size:11px"},["V:"+p.vol]));
    row.appendChild(el("span",{style:"color:var(--mut);font-size:10px"},[isOpen?"▲":"▼"]));
    sc.appendChild(row);
    if(isOpen){
      const det=el("div",{style:"padding:8px 14px 12px;border-bottom:1px solid var(--brd);background:var(--surf)"});
      p.allSets.forEach((s,j)=>{const dr=el("div",{class:"detail-row"});dr.appendChild(el("span",{},[" Serie "+(j+1)]));dr.appendChild(el("span",{style:"color:var(--acc);font-weight:700"},[(s.kg||"—")+" kg"]));dr.appendChild(el("span",{style:"color:var(--a2)"},["× "+(s.reps||"—")]));if(s.note)dr.appendChild(el("span",{style:"font-style:italic;font-size:11px"},[s.note]));det.appendChild(dr);});
      sc.appendChild(det);
    }
  });}
  c.appendChild(sc);
}

function buildSparkline(data,color){
  const W=320,H=90,pad=20,ns="http://www.w3.org/2000/svg";
  const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const px=i=>pad+(i/(data.length-1))*(W-pad*2),py=v=>H-pad-((v-mn)/range)*(H-pad*2);
  const pts=data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ");
  const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("width","100%");svg.style.overflow="visible";
  const defs=document.createElementNS(ns,"defs"),grad=document.createElementNS(ns,"linearGradient");
  grad.setAttribute("id","sg");["x1","y1","x2","y2"].forEach((a,i)=>grad.setAttribute(a,["0","0","0","1"][i]));
  ["0%","100%"].forEach((o,i)=>{const s=document.createElementNS(ns,"stop");s.setAttribute("offset",o);s.setAttribute("stop-color",color);s.setAttribute("stop-opacity",i===0?"0.25":"0");grad.appendChild(s);});
  defs.appendChild(grad);svg.appendChild(defs);
  const poly=document.createElementNS(ns,"polygon");poly.setAttribute("points",px(0)+","+H+" "+pts+" "+px(data.length-1)+","+H);poly.setAttribute("fill","url(#sg)");svg.appendChild(poly);
  const line=document.createElementNS(ns,"polyline");line.setAttribute("points",pts);line.setAttribute("fill","none");line.setAttribute("stroke",color);line.setAttribute("stroke-width","2");line.setAttribute("stroke-linejoin","round");svg.appendChild(line);
  data.forEach((d,i)=>{
    const cx=px(i),cy=py(d.v);
    const circle=document.createElementNS(ns,"circle");circle.setAttribute("cx",cx);circle.setAttribute("cy",cy);circle.setAttribute("r","4");circle.setAttribute("fill",color);circle.setAttribute("stroke","#1c2030");circle.setAttribute("stroke-width","2");svg.appendChild(circle);
    [["9",cy-9,color,"700",d.v],["8",H,"#6b7594","400",d.label]].forEach(([sz,y,col,fw,txt])=>{const t=document.createElementNS(ns,"text");t.setAttribute("x",cx);t.setAttribute("y",y);t.setAttribute("text-anchor","middle");t.setAttribute("font-size",sz);t.setAttribute("fill",col);t.setAttribute("font-weight",fw);t.textContent=txt;svg.appendChild(t);});
  });
  return svg;
}
